<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · Bookstore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-book-open"></i> 
      <span>PageHaven</span>
    </div>
    <div class="nav-links">
      <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a>
      <a href="register.html" class="active"><i class="fas fa-user-plus"></i> Register</a>
      <a href="premium.html" class="premium-badge"><i class="fas fa-crown"></i> Premium</a>
    </div>
  </nav>

  <!-- ===== REGISTER PAGE ===== -->
  <div class="container page-section" id="registerPage">
    <div class="card auth-card">
      <h2><i class="fas fa-user-plus"></i> Create account</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="regName"><i class="far fa-user"></i> Full name</label>
          <input type="text" id="regName" placeholder="Jane Reader" required>
        </div>
        <div class="form-group">
          <label for="regEmail"><i class="far fa-envelope"></i> Email</label>
          <input type="email" id="regEmail" placeholder="jane@example.com" required>
        </div>
        <div class="form-group">
          <label for="regPassword"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="regPassword" placeholder="min 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn-primary"><i class="fas fa-user-check"></i> Register</button>
      </form>
      <p style="margin-top: 1.2rem; color: #3a5a6e;">
        Already a member? <a href="login.html" style="color: #0b2a3b; font-weight: 600;">Login</a>
      </p>
      <div id="registerMessage" style="margin-top: 0.8rem; font-weight: 500;"></div>
    </div>
  </div>

  <footer style="text-align: center; padding: 1.5rem; color: #4b677a; font-size: 0.9rem; border-top: 1px solid #dde9f5; margin-top: 2rem;">
    <i class="fas fa-book"></i> PageHaven · all files connected
  </footer>

  <script src="script.js"></script>
</body>
</html>
