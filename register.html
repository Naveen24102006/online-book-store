<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* Same base styles as login – copy the <style> block from login */
    /* For brevity, I reuse the same CSS – in a real project you'd share it */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5efe9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card { background: white; border-radius: 32px; padding: 40px 36px; max-width: 420px; width: 100%; box-shadow: 0 15px 40px rgba(0,0,0,0.08); border: 1px solid #eee4db; }
    .auth-card .logo { font-size: 32px; font-weight: 700; color: #3e2415; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .auth-card .logo i { color: #b68b6e; }
    .auth-card h2 { font-size: 24px; font-weight: 600; color: #2d1b0e; margin: 6px 0 4px; }
    .auth-card .sub { color: #7a5f4a; font-size: 14px; margin-bottom: 22px; }
    .input-group { display: flex; align-items: center; background: #f5eee8; border-radius: 14px; padding: 0 16px; border: 2px solid transparent; transition: border 0.2s, background 0.2s; margin-bottom: 18px; }
    .input-group:focus-within { border-color: #b68b6e; background: #fcf6f0; }
    .input-group i { color: #8b6e57; font-size: 18px; width: 24px; }
    .input-group input { width: 100%; padding: 16px 0; border: none; background: transparent; font-size: 15px; outline: none; color: #2d1b0e; }
    .input-group input::placeholder { color: #a98d78; }
    .form-options { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin: 6px 0 20px; }
    .form-options label { display: flex; align-items: center; gap: 8px; color: #4a3a2e; cursor: pointer; }
    .form-options a { color: #6b3f28; text-decoration: none; font-weight: 500; }
    .form-options a:hover { text-decoration: underline; }
    .btn-primary { background: #4a2c1a; color: #f5e6d3; border: none; padding: 16px; border-radius: 40px; font-size: 17px; font-weight: 600; cursor: pointer; transition: background 0.25s, transform 0.15s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
    .btn-primary:hover { background: #5f3a26; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74,44,26,0.2); }
    .separator { display: flex; align-items: center; gap: 16px; color: #a98d78; font-size: 13px; margin: 18px 0 12px; }
    .separator::before, .separator::after { content: ""; flex: 1; height: 1px; background: #ddd0c4; }
    .social-login { display: flex; gap: 12px; }
    .social-login button { flex: 1; padding: 12px; border: 1.5px solid #ddd0c4; background: #faf5f0; border-radius: 40px; font-size: 14px; font-weight: 500; color: #3e2415; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .social-login button:hover { background: #efe6dd; border-color: #b68b6e; }
    .switch-link { text-align: center; margin-top: 18px; font-size: 14px; color: #6a5544; }
    .switch-link a { color: #4a2c1a; font-weight: 600; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="logo"><i class="fas fa-book-open"></i> BookVerse</div>
  <h2>Join the community</h2>
  <p class="sub">Create your free account</p>
  <div class="input-group">
    <i class="fas fa-user"></i>
    <input type="text" id="regName" placeholder="Full name" value="John Doe" />
  </div>
  <div class="input-group">
    <i class="fas fa-envelope"></i>
    <input type="email" id="regEmail" placeholder="Email" value="john@example.com" />
  </div>
  <div class="input-group">
    <i class="fas fa-lock"></i>
    <input type="password" id="regPassword" placeholder="Password" value="password" />
  </div>
  <div class="input-group">
    <i class="fas fa-check-circle"></i>
    <input type="password" id="regConfirm" placeholder="Confirm password" value="password" />
  </div>
  <div class="form-options">
    <label><input type="checkbox" checked /> I agree to the <a href="#">Terms &amp; Privacy</a></label>
  </div>
  <button class="btn-primary" id="registerBtn"><i class="fas fa-user-plus"></i> Create Account</button>
  <div class="separator">or continue with</div>
  <div class="social-login">
    <button><i class="fab fa-google"></i> Google</button>
    <button><i class="fab fa-apple"></i> Apple</button>
  </div>
  <div class="switch-link">
    Already have an account? <a id="goToLogin">Sign in</a>
  </div>
</div>
<script>
  document.getElementById('registerBtn').addEventListener('click', function() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    if (!name || !email) {
      alert('Please fill in name and email.');
      return;
    }
    if (pass !== confirm) {
      alert('Passwords do not match.');
      return;
    }
    alert('Account created for ' + name + ' (' + email + ')');
    // Redirect to login or dashboard
  });
</script>
</body>
</html>
