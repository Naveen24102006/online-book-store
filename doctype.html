<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookVerse — Online Book Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5efe9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app {
            width: 100%;
            max-width: 1300px;
            background: #fffcf8;
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            overflow: hidden;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* ---------- PAGES ---------- */
        .page {
            display: none;
            padding: 30px 40px 40px;
            animation: fadeUp 0.35s ease;
        }
        .page.active { display: block; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* ---------- AUTH PAGES ---------- */
        .auth-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            padding: 20px;
            background: linear-gradient(135deg, #faf3ed 0%, #f0e3d8 100%);
        }
        .auth-card {
            background: white;
            border-radius: 32px;
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            border: 1px solid #eee4db;
        }
        .auth-card .logo {
            font-size: 32px;
            font-weight: 700;
            color: #3e2415;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .auth-card .logo i { color: #b68b6e; }
        .auth-card h2 {
            font-size: 24px;
            font-weight: 600;
            color: #2d1b0e;
            margin: 6px 0 4px;
        }
        .auth-card .sub {
            color: #7a5f4a;
            font-size: 14px;
            margin-bottom: 22px;
        }
        .input-group {
            display: flex;
            align-items: center;
            background: #f5eee8;
            border-radius: 14px;
            padding: 0 16px;
            border: 2px solid transparent;
            transition: border 0.2s, background 0.2s;
            margin-bottom: 18px;
        }
        .input-group:focus-within {
            border-color: #b68b6e;
            background: #fcf6f0;
        }
        .input-group i {
            color: #8b6e57;
            font-size: 18px;
            width: 24px;
        }
        .input-group input {
            width: 100%;
            padding: 16px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
            color: #2d1b0e;
        }
        .input-group input::placeholder { color: #a98d78; }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin: 6px 0 20px;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4a3a2e;
            cursor: pointer;
        }
        .form-options a {
            color: #6b3f28;
            text-decoration: none;
            font-weight: 500;
        }
        .form-options a:hover { text-decoration: underline; }
        .btn-primary {
            background: #4a2c1a;
            color: #f5e6d3;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }
        .btn-primary:hover {
            background: #5f3a26;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74,44,26,0.2);
        }
        .separator {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #a98d78;
            font-size: 13px;
            margin: 18px 0 12px;
        }
        .separator::before,
        .separator::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd0c4;
        }
        .social-login {
            display: flex;
            gap: 12px;
        }
        .social-login button {
            flex: 1;
            padding: 12px;
            border: 1.5px solid #ddd0c4;
            background: #faf5f0;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            color: #3e2415;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .social-login button:hover {
            background: #efe6dd;
            border-color: #b68b6e;
        }
        .switch-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #6a5544;
        }
        .switch-link a {
            color: #4a2c1a;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .switch-link a:hover { text-decoration: underline; }

        /* ---------- DASHBOARD LAYOUT ---------- */
        .dashboard-layout {
            display: flex;
            gap: 0;
            min-height: 650px;
        }
        .sidebar {
            width: 240px;
            background: #f8f2ec;
            padding: 30px 16px 20px;
            border-right: 1px solid #e8ddd4;
            flex-shrink: 0;
        }
        .sidebar .brand {
            font-size: 26px;
            font-weight: 700;
            color: #3e2415;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            padding-left: 8px;
        }
        .sidebar .brand i { color: #b68b6e; }
        .sidebar nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sidebar nav ul li {
            border-radius: 12px;
            transition: background 0.2s;
        }
        .sidebar nav ul li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            color: #4a3a2e;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            border-radius: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar nav ul li a i {
            width: 24px;
            text-align: center;
            font-size: 18px;
            color: #7a5f4a;
        }
        .sidebar nav ul li.active a {
            background: #4a2c1a;
            color: #f5e6d3;
        }
        .sidebar nav ul li.active a i { color: #f5e6d3; }
        .sidebar nav ul li a:hover:not(.active a) {
            background: #e8ddd4;
        }
        .sidebar .user-info {
            margin-top: 40px;
            padding: 16px 12px;
            border-top: 1px solid #e0d3c8;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar .user-info .avatar {
            width: 44px;
            height: 44px;
            background: #b68b6e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 18px;
        }
        .sidebar .user-info .name {
            font-weight: 600;
            color: #2d1b0e;
        }
        .sidebar .user-info .email {
            font-size: 12px;
            color: #7a5f4a;
        }
        .logout-btn {
            margin-top: 10px;
            padding: 10px 16px;
            background: none;
            border: 1px solid #d4c2b6;
            border-radius: 30px;
            color: #4a3a2e;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .logout-btn:hover {
            background: #e8ddd4;
            border-color: #b68b6e;
        }
        .main-content {
            flex: 1;
            padding: 30px 36px 36px;
            background: #fffcf8;
            overflow-y: auto;
        }
        .page-title {
            font-size: 28px;
            font-weight: 600;
            color: #2d1b0e;
            margin-bottom: 6px;
        }
        .page-desc {
            color: #7a5f4a;
            margin-bottom: 24px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #f8f2ec;
            border-radius: 20px;
            padding: 20px 18px;
            border: 1px solid #e8ddd4;
        }
        .stat-card .num {
            font-size: 32px;
            font-weight: 700;
            color: #2d1b0e;
        }
        .stat-card .label {
            font-size: 14px;
            color: #7a5f4a;
            margin-top: 4px;
        }
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e8ddd4;
            border-radius: 40px;
            font-size: 15px;
            background: #faf5f0;
            outline: none;
            transition: border 0.2s;
            min-width: 200px;
        }
        .search-bar input:focus {
            border-color: #b68b6e;
            background: white;
        }
        .search-bar button {
            padding: 14px 28px;
            background: #4a2c1a;
            color: #f5e6d3;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-bar button:hover {
            background: #5f3a26;
        }
        .search-bar .clear-btn {
            background: #e8ddd4;
            color: #2d1b0e;
        }
        .search-bar .clear-btn:hover {
            background: #d4c2b6;
        }
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }
        .item-card {
            background: #faf5f0;
            border-radius: 20px;
            padding: 18px 16px 20px;
            border: 1px solid #e8ddd4;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .item-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .item-card .title {
            font-weight: 600;
            font-size: 17px;
            color: #2d1b0e;
        }
        .item-card .author {
            font-size: 14px;
            color: #7a5f4a;
            margin: 4px 0 8px;
        }
        .item-card .price {
            font-weight: 700;
            color: #4a2c1a;
            font-size: 18px;
        }
        .item-card .actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .item-card .actions button {
            flex: 1;
            padding: 8px 0;
            border: none;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
        }
        .item-card .actions .add-cart {
            background: #4a2c1a;
            color: #f5e6d3;
        }
        .item-card .actions .add-cart:hover {
            background: #5f3a26;
        }
        .item-card .actions .select-order {
            background: #e8ddd4;
            color: #2d1b0e;
        }
        .item-card .actions .select-order:hover {
            background: #d4c2b6;
        }
        .order-form {
            max-width: 600px;
        }
        .order-form .form-group {
            margin-bottom: 18px;
        }
        .order-form label {
            font-weight: 500;
            color: #3e2415;
            display: block;
            margin-bottom: 4px;
        }
        .order-form input,
        .order-form textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e8ddd4;
            border-radius: 16px;
            font-size: 15px;
            background: #faf5f0;
            outline: none;
            transition: border 0.2s;
            font-family: inherit;
        }
        .order-form input:focus,
        .order-form textarea:focus {
            border-color: #b68b6e;
            background: white;
        }
        .order-form textarea {
            resize: vertical;
            min-height: 80px;
        }
        .order-summary {
            background: #f8f2ec;
            border-radius: 20px;
            padding: 20px 24px;
            margin: 16px 0 20px;
            border: 1px solid #e8ddd4;
        }
        .order-summary h3 {
            font-size: 18px;
            color: #2d1b0e;
            margin-bottom: 12px;
        }
        .order-summary .order-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #ddd0c4;
        }
        .order-summary .order-item:last-child {
            border-bottom: none;
        }
        .order-summary .total {
            font-weight: 700;
            font-size: 20px;
            color: #2d1b0e;
            margin-top: 12px;
            text-align: right;
        }
        .btn-place {
            background: #4a2c1a;
            color: #f5e6d3;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.15s;
        }
        .btn-place:hover {
            background: #5f3a26;
            transform: translateY(-2px);
        }
        .hidden { display: none !important; }
        .empty-message {
            color: #a98d78;
            font-size: 16px;
            padding: 30px 0;
            text-align: center;
        }
        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 820px) {
            .app { border-radius: 24px; }
            .dashboard-layout { flex-direction: column; }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e8ddd4;
                padding: 18px 20px;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 12px;
            }
            .sidebar .brand { margin-bottom: 0; font-size: 22px; }
            .sidebar nav ul { flex-direction: row; flex-wrap: wrap; gap: 4px; }
            .sidebar nav ul li a { padding: 10px 14px; font-size: 14px; }
            .sidebar .user-info { margin-top: 0; border-top: none; margin-left: auto; }
            .sidebar .logout-btn { width: auto; padding: 8px 16px; }
            .main-content { padding: 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .items-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .auth-card { padding: 30px 24px; }
        }
        @media (max-width: 480px) {
            .page { padding: 16px; }
            .sidebar { flex-direction: column; align-items: stretch; }
            .sidebar .user-info { margin-left: 0; }
            .stats-grid { grid-template-columns: 1fr; }
            .search-bar input { min-width: 140px; }
            .items-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- ========== LOGIN PAGE ========== -->
    <div class="page active" id="loginPage">
        <div class="auth-page">
            <div class="auth-card">
                <div class="logo"><i class="fas fa-book-open"></i> BookVerse</div>
                <h2>Welcome back</h2>
                <p class="sub">Sign in to continue your reading journey</p>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email" value="demo@bookverse.com" />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Password" value="password" />
                </div>
                <div class="form-options">
                    <label><input type="checkbox" checked /> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>
                <button class="btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
                <div class="separator">or continue with</div>
                <div class="social-login">
                    <button><i class="fab fa-google"></i> Google</button>
                    <button><i class="fab fa-apple"></i> Apple</button>
                </div>
                <div class="switch-link">
                    Don't have an account? <a id="goToRegister">Create one</a>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== REGISTER PAGE ========== -->
    <div class="page" id="registerPage">
        <div class="auth-page">
            <div class="auth-card">
                <div class="logo"><i class="fas fa-book-open"></i> BookVerse</div>
                <h2>Join the community</h2>
                <p class="sub">Create your free account</p>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="regName" placeholder="Full name" value="John Doe" />
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Email" value="john@example.com" />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="regPassword" placeholder="Password" value="password" />
                </div>
                <div class="input-group">
                    <i class="fas fa-check-circle"></i>
                    <input type="password" id="regConfirm" placeholder="Confirm password" value="password" />
                </div>
                <div class="form-options">
                    <label><input type="checkbox" checked /> I agree to the <a
