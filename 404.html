<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Bookstore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-book-open"></i> 
      <span>PageHaven</span>
    </div>
    <div class="nav-links">
      <a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
      <a href="login.html" class="active"><i class="fas fa-sign-in-alt"></i> Login</a>
      <a href="register.html"><i class="fas fa-user-plus"></i> Register</a>
      <a href="premium.html" class="premium-badge"><i class="fas fa-crown"></i> Premium</a>
    </div>
  </nav>

  <!-- ===== LOGIN PAGE ===== -->
  <div class="container page-section" id="loginPage">
    <div class="card auth-card">
      <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail"><i class="far fa-envelope"></i> Email</label>
          <input type="email" id="loginEmail" placeholder="booklover@example.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary"><i class="fas fa-arrow-right"></i> Log in</button>
      </form>
      <p style="margin-top: 1.2rem; color: #3a5a6e;">
        Don't have an account? <a href="register.html" style="color: #0b2a3b; font-weight: 600;">Register</a>
      </p>
      <div id="loginMessage" style="margin-top: 0.8rem; font-weight: 500;"></div>
    </div>
  </div>

  <footer style="text-align: center; padding: 1.5rem; color: #4b677a; font-size: 0.9rem; border-top: 1px solid #dde9f5; margin-top: 2rem;">
    <i class="fas fa-book"></i> PageHaven · all files connected
  </footer>

  <script src="script.js"></script>
</body>
</html>
